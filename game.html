<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Игра — GameVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">GameVault</a>
    <a href="index.html" class="back-link">← На главную</a>
  </header>
  <main class="container" id="gamePage">
    <p class="loading">Загрузка...</p>
  </main>
  <footer class="site-footer">
    <p>© 2025 GameVault — учебный проект. Все изображения принадлежат правообладателям.</p>
  </footer>
  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" aria-label="Закрыть">✕</button>
    <button class="lb-prev" aria-label="Назад">‹</button>
    <img id="lightboxImg" src="" alt="Просмотр" />
    <button class="lb-next" aria-label="Вперёд">›</button>
  </div>
  <script src="data/games.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const gameId = params.get("id");
    const game = games.find(g => g.id === gameId);
    const container = document.getElementById("gamePage");

    if (!game) {
      container.innerHTML = `<p class="no-results">Игра не найдена. <a href="index.html">На главную</a></p>`;
    } else {
      document.title = game.title + " — GameVault";
      const platformTags = game.platforms.map(p => `<span class="tag">${p}</span>`).join("");
      const screenshots = game.screenshots.map((src, i) =>
        `<img src="${src}" alt="Скриншот" data-index="${i}" class="lb-trigger" loading="lazy" onerror="this.style.display='none'" />`
      ).join("");
      const reqRow = (obj) => Object.entries(obj).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
      let trailerBlock = "";
      if (game.trailer) {
        trailerBlock = `<section><h2>Трейлер</h2><div class="video-wrap"><iframe src="${game.trailer}" allowfullscreen loading="lazy"></iframe></div></section>`;
      }

      container.innerHTML = `
        <article class="game-detail">
          <div class="detail-top">
            <img class="detail-cover lb-trigger" src="${game.cover}" alt="${game.title}" data-cover="1" onerror="this.style.display='none'" />
            <div class="detail-info">
              <h1>${game.title}</h1>
              <p class="meta">${game.genre} • ${game.developer}</p>
              <p class="release">Дата выхода: ${game.releaseDate}</p>
              <div class="platforms">${platformTags}</div>
              <p class="short-desc">${game.shortDescription}</p>
            </div>
          </div>
          <section class="screenshots"><h2>Скриншоты <small>(кликните, чтобы увеличить)</small></h2><div class="gallery">${screenshots}</div></section>
          ${trailerBlock}
          <section class="story"><h2>О сюжете (кратко)</h2><p>${game.storyShort}</p><details><summary>Полный пересказ сюжета (осторожно, спойлеры)</summary><p>${game.storyFull}</p></details></section>
          <section class="requirements"><h2>Системные требования</h2><div class="req-grid"><div><h3>Минимальные</h3><table>${reqRow(game.minRequirements)}</table></div><div><h3>Рекомендуемые</h3><table>${reqRow(game.recRequirements)}</table></div></div></section>
        </article>`;

      const allImages = [game.cover, ...game.screenshots];
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightboxImg");
      let currentIdx = 0;
      function openLightbox(index) { if(!allImages[index]) return; currentIdx = index; lightboxImg.src = allImages[currentIdx]; lightbox.hidden = false; document.body.style.overflow = "hidden"; }
      function closeLightbox() { lightbox.hidden = true; document.body.style.overflow = ""; }
      function showPrev() { currentIdx = (currentIdx - 1 + allImages.length) % allImages.length; lightboxImg.src = allImages[currentIdx]; }
      function showNext() { currentIdx = (currentIdx + 1) % allImages.length; lightboxImg.src = allImages[currentIdx]; }

      document.querySelectorAll(".lb-trigger").forEach(el => {
        el.addEventListener("click", () => { openLightbox(el.dataset.cover === "1" ? 0 : parseInt(el.dataset.index, 10) + 1); });
      });
      lightbox.querySelector(".lb-close").addEventListener("click", closeLightbox);
      lightbox.querySelector(".lb-prev").addEventListener("click", showPrev);
      lightbox.querySelector(".lb-next").addEventListener("click", showNext);
      lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });
      document.addEventListener("keydown", (e) => {
        if (lightbox.hidden) return;
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowLeft") showPrev();
        if (e.key === "ArrowRight") showNext();
      });
    }
  </script>
</body>
</html>
