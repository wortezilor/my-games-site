<!DOCTYPE html>
<html lang="ru">
<head>
  <title>GameVault — современные игры</title>

  <!-- Open Graph теги для красивых ссылок в соцсетях -->
  <meta property="og:title" content="GameVault — современные игры" />
  <meta property="og:description" content="Картинки, пересказ сюжета и технические требования в одном месте." />
  <meta property="og:type" content="website" />
  <!-- Ссылка на картинку-превью. ОБЯЗАТЕЛЬНО замените "ВАШ-НИКНЕЙМ" на ваш ник на GitHub, когда загрузите сайт! -->
  <meta property="og:image" content="https://wortezilor.github.io/my-games-site/images/bg.jpg" />
 <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameVault — современные игры</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Exo+2:ital,wght@1,700&family=Jura:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">🎮 GameVault</a>
    <p class="tagline">Обзоры, сюжеты и системные требования</p>
	    <a href="about.html" style="color: var(--gold); font-size: 0.9rem; text-decoration: none; margin-top: 10px; border-bottom: 1px solid var(--gold); display: inline-block;">Об авторе →</a>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Современные игры</h1>
      <p>Картинки, пересказ сюжета и технические требования в одном месте.</p>

      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="🔍 Поиск по названию..."
      />

                 <div class="filters" id="filters">
        <button class="filter-btn active" data-genre="all">Все</button>
        <button class="filter-btn" data-genre="RPG">RPG</button>
        <button class="filter-btn" data-genre="Экшен">Экшен</button>
        <button class="filter-btn" data-genre="Souls-like">Souls-like</button>
        <button class="filter-btn" data-genre="Пошаговая">Пошаговая</button>
        <button class="filter-btn" data-genre="Шутер">Шутер</button>
        <button class="filter-btn" data-genre="Открытый мир">Открытый мир</button>
        <button class="filter-btn" data-genre="Интерактивное кино">Интерактивное кино</button>
        <button class="filter-btn" data-genre="Хоррор">Хоррор</button>
        <button class="filter-btn" data-genre="Стелс">Стелс</button>
        <!-- Добавили новые -->
        <button class="filter-btn" data-genre="Приключение">Приключение</button>
        <button class="filter-btn" data-genre="Выживание">Выживание</button>
      </div>

      <!-- НОВЫЙ БЛОК: Сортировка -->
      <div class="sort-controls" style="margin-bottom: 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <span style="color: var(--text-dim); font-size: 0.9rem;">Сортировка:</span>
        <button class="filter-btn active sort-btn" data-sort="default">По умолчанию</button>
        <button class="filter-btn sort-btn" data-sort="newest">Сначала новые</button>
        <button class="filter-btn sort-btn" data-sort="oldest">Сначала старые</button>
      </div>
    </section>

    <section id="gamesGrid" class="games-grid"></section>
    <p id="noResults" class="no-results" hidden>Игр не найдено 😔</p>
  </main>

    <footer class="site-footer">
    <p>© 2025 GameVault — учебный проект. Все изображения принадлежат правообладателям.</p>
    <p style="margin-top: 10px;">
      <a href="https://www.twitch.tv/wortezilor" target="_blank" rel="noopener noreferrer" style="color: #9146FF; font-weight: 500; text-decoration: none;">Мои стримы на Twitch →</a>
    </p>
  </footer>

  <script src="data/games.js"></script>
    <!-- Кнопка наверх -->
  <button id="scrollTopBtn" class="scroll-top" title="Наверх">↑</button>
  <script src="script.js"></script>
</body>
</html>
